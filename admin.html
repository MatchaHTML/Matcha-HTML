<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1E3A8A">
<title>MATCHA.HTML — admin</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Kanit:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--navy:#1E3A8A;--navy2:#172E6E;--cream:#FFF4DC;--yellow:#F5B82E;--orange:#EC7A2C;--green:#8BD45A;--red:#FF7A6B;--px:"Press Start 2P",monospace;--th:"Kanit",system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--navy);color:var(--cream);font-family:var(--th);min-height:100vh}
button,input{font:inherit;color:inherit}
.bar{position:sticky;top:0;z-index:5;background:var(--cream);color:var(--navy);display:flex;align-items:center;justify-content:space-between;padding:10px 14px;font-family:var(--px);font-size:10px}
.bar .dots{display:flex;gap:6px}.bar .dots i{width:10px;height:10px;display:block;background:var(--navy)}
.bar .dots i:nth-child(1){background:var(--orange)}.bar .dots i:nth-child(2){background:var(--yellow)}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 40px}
header{display:flex;align-items:center;gap:12px;padding:18px 0 6px}
header img{width:44px;image-rendering:pixelated}
.logo{font-family:var(--px);font-size:16px}.logo b{color:var(--yellow);font-weight:normal}
.sub{font-family:var(--px);font-size:8px;color:var(--yellow);margin-top:8px}.sub em{color:var(--orange);font-style:normal}
.tabs{display:flex;gap:6px;margin:14px 0;position:sticky;top:36px;background:var(--navy);padding:8px 0;z-index:4}
.tabs button{flex:1;padding:10px 4px;border:3px solid var(--cream);background:transparent;cursor:pointer;font-size:14px}
.tabs button.on{background:var(--cream);color:var(--navy);font-weight:600}
.tabs b{font-family:var(--px);font-size:10px;margin-left:4px;color:var(--orange)}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
.sum div{background:var(--navy2);border:3px solid rgba(255,244,220,.25);padding:10px}
.sum .k{font-size:12px;opacity:.7}.sum .v{font-family:var(--px);font-size:13px;margin-top:6px;color:var(--yellow)}
.ord{background:var(--navy2);border:3px solid rgba(255,244,220,.3);padding:14px;margin-bottom:12px}
.ord.new{border-color:var(--yellow);box-shadow:5px 5px 0 var(--orange)}
.ord.accepted{border-color:var(--cream)}.ord.ready{border-color:var(--green)}
.ord.done,.ord.cancel{opacity:.5}
.oh{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.oh .no{font-family:var(--px);font-size:11px;color:var(--yellow)}
.oh .nm{font-size:22px;font-weight:600;margin-top:6px}
.oh .tm{font-size:13px;opacity:.7;text-align:right}
.badge{display:inline-block;font-family:var(--px);font-size:8px;padding:5px 7px;margin-top:6px;background:var(--cream);color:var(--navy)}
.badge.new{background:var(--yellow)}.badge.ready{background:var(--green)}.badge.cancel{background:var(--red)}
.it{border-top:1px dashed rgba(255,244,220,.3);padding:8px 0;display:flex;justify-content:space-between;gap:10px}
.it .a{font-size:17px;font-weight:500}.it .b{font-size:14px;opacity:.8;margin-top:2px}
.it .q{font-family:var(--px);font-size:13px;color:var(--yellow);white-space:nowrap}
.tot{display:flex;justify-content:space-between;border-top:1px dashed rgba(255,244,220,.3);padding-top:8px;font-family:var(--px);font-size:11px}
.acts{display:flex;gap:8px;margin-top:12px}
.acts button{flex:1;padding:14px 6px;border:none;cursor:pointer;font-size:16px;font-weight:600;box-shadow:4px 4px 0 var(--orange)}
.acts .go{background:var(--yellow);color:var(--navy)}.acts .ok{background:var(--green);color:var(--navy)}
.acts .x{flex:0 0 72px;background:transparent;color:var(--cream);border:3px solid rgba(255,244,220,.5);box-shadow:none;font-size:13px}
.login{margin-top:40px}
.login input{width:100%;font-size:24px;padding:16px;text-align:center;background:var(--cream);color:var(--navy);border:4px solid var(--cream);letter-spacing:6px}
.login button{width:100%;margin-top:14px;padding:16px;background:var(--yellow);color:var(--navy);border:none;font-family:var(--px);font-size:12px;box-shadow:5px 5px 0 var(--orange);cursor:pointer}
.empty{opacity:.5;padding:20px 0;text-align:center}
.upd{font-family:var(--px);font-size:8px;opacity:.5;margin-top:10px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--cream);color:var(--navy);padding:12px 16px;box-shadow:4px 4px 0 var(--orange);z-index:40;display:none;max-width:90vw}
.login input{display:block}
.who{display:flex;justify-content:space-between;align-items:center;font-family:var(--px);font-size:9px;color:var(--yellow);margin:6px 0 10px}
.who button{background:none;border:2px solid rgba(255,244,220,.5);color:var(--cream);font-family:var(--px);font-size:8px;padding:6px 8px;cursor:pointer}
.shop{background:var(--navy2);border:3px solid var(--cream);padding:12px;margin-bottom:12px}
.sh{display:flex;justify-content:space-between;align-items:center;font-family:var(--px);font-size:11px;margin-bottom:10px}
.pill{font-family:var(--px);font-size:9px;padding:6px 8px;background:var(--green);color:var(--navy)}.pill.off{background:var(--red)}
.row2{display:flex;gap:8px;align-items:flex-end}.row2 label{flex:1;font-size:12px;opacity:.9}
.row2 input{display:block;width:100%;margin-top:4px;padding:9px;font-size:16px;background:var(--cream);color:var(--navy);border:none}
.sbtn{padding:11px 12px;border:none;background:var(--yellow);color:var(--navy);font-weight:600;cursor:pointer}
.sbtn.ghost{background:transparent;color:var(--cream);border:2px solid rgba(255,244,220,.5)}
.wide{display:block;width:100%;margin-top:10px;padding:13px;border:3px solid var(--cream);background:transparent;font-weight:600;font-size:16px;cursor:pointer}
.wide.on{background:var(--red);border-color:var(--red);color:var(--navy)}
.wide.sum2{background:var(--yellow);color:var(--navy);border-color:var(--yellow);box-shadow:4px 4px 0 var(--orange)}
.mcard{background:var(--navy2);border:3px solid rgba(255,244,220,.3);padding:12px;margin-bottom:10px}
.mcard.off{opacity:.55}
.mcard .r{display:flex;gap:8px;margin-top:8px}
.mcard input{width:100%;padding:9px;font-size:16px;background:var(--cream);color:var(--navy);border:none}
.tg{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tg button{padding:7px 10px;border:2px solid rgba(255,244,220,.5);background:transparent;font-size:14px;cursor:pointer}
.tg button.on{background:var(--green);border-color:var(--green);color:var(--navy);font-weight:600}
.tg button.del{margin-left:auto;border-color:var(--red);color:var(--red)}
.srow2{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px dashed rgba(255,244,220,.25)}
.srow2 .n{flex:1;font-size:15px}.srow2 .n small{display:block;opacity:.7;font-size:12px}
.srow2 input{width:70px;padding:8px;font-size:16px;background:var(--cream);color:var(--navy);border:none}
.coco{border-top:1px dashed rgba(255,244,220,.3);margin-top:12px;padding-top:10px}
.sh2{font-size:15px;font-weight:600;margin-bottom:6px}.muted{opacity:.7;font-weight:400;font-size:13px}
.modal{position:fixed;inset:0;background:rgba(10,20,50,.8);z-index:30;display:none;align-items:flex-end;justify-content:center}
.modal .box{background:var(--navy);border-top:4px solid var(--cream);width:100%;max-width:720px;max-height:88vh;overflow:auto;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
.chk{display:flex;gap:10px;align-items:center;margin-top:14px;font-size:15px}.chk input{width:22px;height:22px}
.srow{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed rgba(255,244,220,.3)}
.ord.focus{outline:4px solid var(--yellow);outline-offset:3px}
.newflash{animation:fl .6s 3}@keyframes fl{50%{background:var(--orange)}}
</style>
</head>
<body>
<div class="bar"><span>admin_orders.html</span><span class="dots"><i></i><i></i><i></i></span></div>
<div class="wrap">
  <header><img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAIwAAACoCAYAAAAy/QYeAAAB6UlEQVR42u3cIXLCQBSA4bcMojfAkUp0JaoqB+AAtVwAXYFkuEBtD5ADoHoCNAIBsh6BCxdozQ4k7OT7PDNM8s9bkXmbpvNN0L/9+3eb87u3n4/U5f8ceVUIBsEgGASDYEAwCAbBIBgEg2BAMNzD2COIQX51NmEQDIJBMAgGBINgEAyCQTAIBgSDYOhVyt2tPu8WrcdXrqpukgmDIwnBIBgEA4JBMAgGwSAYBAOCQTD0JrWXo6/OmDAIBsEgGAQDgkEwCAbBIBgEA4JBMEQZN4FXdePpxZ83gUfmTeCd/s/zbmHC4EhCMAgGwYBgEAyCQTAIBsGAYBAMUd5u9fb06ekVbPW6NmFwJCEYBINgQDAIBsEgGASDYEAwCIYob7e6a6vZV9bvtoelt2zCIBgEg2AQDAgGwSAYBINgQDAIBsHwbNJ0vonMm6TtZEe5O9JV3SQTBkcSgkEwCAYEg2AQDIJBMAgGBINgiMHsVufuSPOP668JgyMJwSAYEAyCQTAIBsEgGBAMgkEwCAbBgGAQDIJBMAgGwYBgEAyCQTAIBsFAPG63Ovcm6dwbxONlEnak7/ceTBgEg2AQDIIBwSAYBINgEAyCAcEgGGJQN4FHITdeY8IgGASDYBAMggHBIBgEg2AQDAgGwfBAN4uiNqU57NUJAAAAAElFTkSuQmCC" alt=""><div><div class="logo"><b>MATCHA</b>.HTML</div><div class="sub"><em>&gt;</em> sudo orders --live</div></div></header>
  <div id="loginBox" class="login">
    <div style="font-family:var(--px);font-size:10px;color:var(--yellow);margin-bottom:12px">&gt; sudo login</div>
    <input id="uid" placeholder="ID" autocapitalize="off" autocomplete="username" style="letter-spacing:1px">
    <input id="pin" type="password" placeholder="password" autocomplete="current-password" style="margin-top:10px">
    <button id="loginBtn">LOGIN &gt;</button>
  </div>
  <div id="app" style="display:none">
    <div class="who"><span>&gt; user: <b id="who"></b></span><span style="display:flex;gap:6px"><a href="./" style="border:2px solid rgba(255,244,220,.5);color:var(--cream);font-family:var(--px);font-size:8px;padding:6px 8px;text-decoration:none">← บัญชี</a><button id="logout">LOGOUT</button></span></div>
    <div class="shop" id="shopBox">
      <div class="sh"><span>SHOP</span><span class="pill" id="shopPill">...</span></div>
      <div class="row2"><label>เปิดรับ<input type="time" id="tOpen"></label><label>ปิดรับ<input type="time" id="tClose"></label><button class="sbtn" id="saveTime">SAVE</button></div>
      <button class="wide" id="toggleClose">ปิดรับออเดอร์วันนี้</button>
      <div class="coco">
        <div class="sh2">📦 เมนูจำกัดจำนวน (ต้องเปิดขายรายวัน)</div>
        <div id="stockList"></div>
      </div>
      <button class="wide" id="menuBtn">🍵 จัดการเมนู (เพิ่ม / แก้ราคา / ซ่อน)</button>
      <button class="wide sum2" id="sumBtn">📊 สรุปการขาย &amp; ปิดยอดวันนี้</button>
    </div>
    <div class="sum"><div><div class="k">ออเดอร์วันนี้</div><div class="v" id="sOrders">0</div></div><div><div class="k">แก้ววันนี้</div><div class="v" id="sCups">0</div></div><div><div class="k">ยอดวันนี้</div><div class="v" id="sTotal">฿0</div></div></div>
    <div class="tabs" id="tabs">
      <button data-t="new" class="on">ใหม่<b id="c-new"></b></button>
      <button data-t="accepted">กำลังทำ<b id="c-accepted"></b></button>
      <button data-t="ready">พร้อมรับ<b id="c-ready"></b></button>
      <button data-t="all">ทั้งหมด</button>
    </div>
    <div id="list"></div>
    <div class="upd" id="upd"></div>
  </div>
</div>
<div class="modal" id="sumM"><div class="box">
  <div style="font-family:var(--px);font-size:11px;color:var(--yellow);margin-bottom:12px">&gt; day_summary.txt</div>
  <div id="sumBody"></div>
  <label class="chk"><input type="checkbox" id="sumRecord" checked> บันทึกยอดขายเป็นรายรับในแอปบัญชี</label>
  <div style="font-size:13px;opacity:.7;margin-top:6px">กดยืนยันแล้ว: ปิดรับออเดอร์วันนี้ + ส่งสรุปเข้า Telegram</div>
  <div class="acts"><button class="x" style="flex:1" id="sumCancel">CANCEL</button><button class="go" style="flex:2" id="sumGo">ยืนยันปิดยอด</button></div>
</div></div>
<div class="modal" id="menuM"><div class="box">
  <div style="font-family:var(--px);font-size:11px;color:var(--yellow);margin-bottom:12px">&gt; menu_editor.json</div>
  <div id="menuEd"></div>
  <button class="wide" id="mAdd">+ เพิ่มเมนูใหม่</button>
  <div class="row2" style="margin-top:14px"><label>นมโอ๊ต บวกเพิ่ม (฿)<input type="number" id="mOat"></label><label>ท็อปปิ้ง ชื่อ<input id="mTopName"></label><label>ท็อปปิ้ง (฿)<input type="number" id="mTop"></label></div>
  <div class="acts"><button class="x" style="flex:1" id="mCancel">CANCEL</button><button class="go" style="flex:2" id="mSave">SAVE MENU</button></div>
</div></div>
<div class="toast" id="toast"></div>
<script>
const API='https://script.google.com/macros/s/AKfycbxCuTMM5xERPcApcj84-vxWli_Qy-lxFXugBDvqyeuYHRO0mKDEgvip37a__f-XuaQ7Fw/exec';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const LS={get(k,d){try{const v=localStorage.getItem('mha_'+k);return v==null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem('mha_'+k,v)}catch(e){}}};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hm=t=>{const d=new Date(t);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
const LBL={new:'NEW',accepted:'MAKING',ready:'READY',done:'DONE',cancel:'CANCELLED'};
let FOCUS=new URLSearchParams(location.search).get('no')||'', focused=false;
let prevSt={}, user=LS.get('user',''), pin=LS.get('pin',''), tab='new', SHOP=null, orders=[], known=null, busy=false;
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',2500)}
async function api(action,p={}){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({action,user,pass:pin},p))});const j=await r.json();if(!j.ok)throw new Error(j.error);return j.data}
$('#loginBtn').onclick=async()=>{user=$('#uid').value.trim();pin=$('#pin').value;
  try{const r=await api('adminLogin');user=r.user;LS.set('user',user);LS.set('pin',pin);start()}catch(e){toast(e.message)}};
$('#logout').onclick=()=>{LS.set('user','');LS.set('pin','');location.reload()};
$('#pin').onkeydown=e=>{if(e.key==='Enter')$('#loginBtn').click()};
function start(){if(FOCUS){tab='all';$$('#tabs button').forEach(x=>x.classList.toggle('on',x.dataset.t==='all'))}$('#loginBox').style.display='none';$('#app').style.display='block';$('#who').textContent=user;load();loadShop();setInterval(()=>{if(!busy){load();loadShop()}},10000)}
$$('#tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;$$('#tabs button').forEach(x=>x.classList.toggle('on',x===b));render()});
let ctx;function beep(){try{ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();[0,.18,.36].forEach(t=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type='square';o.frequency.value=880+t*800;g.gain.value=.08;o.connect(g);g.connect(ctx.destination);o.start(ctx.currentTime+t);o.stop(ctx.currentTime+t+.12)})}catch(e){}if(navigator.vibrate)navigator.vibrate([200,100,200])}
document.addEventListener('click',()=>{try{ctx=ctx||new (window.AudioContext||window.webkitAudioContext)()}catch(e){}},{once:true});
async function load(){
  try{orders=await api('listOrders');
    const ids=new Set(orders.filter(o=>o.status==='new').map(o=>o.no));
    if(known&&[...ids].some(i=>!known.has(i))){beep();toast('🔔 มีออเดอร์ใหม่!');document.title='🔔 NEW ORDER';setTimeout(()=>document.title='MATCHA.HTML — admin',4000)}
    known=new Set([...(known||[]),...ids]);
    const cx=orders.filter(o=>o.status==='cancel'&&prevSt[o.no]&&prevSt[o.no]!=='cancel'&&o.by==='ลูกค้า');
    if(cx.length){beep();toast('❌ ลูกค้ายกเลิก #'+cx.map(o=>o.no+' ('+o.name+')').join(', '))}
    prevSt={};orders.forEach(o=>prevSt[o.no]=o.status);
    render();$('#upd').textContent='> updated '+hm(Date.now())+' · auto refresh 10s';
  }catch(e){$('#upd').textContent='> error: '+e.message}
}
function render(){
  const valid=orders.filter(o=>o.status!=='cancel');
  $('#sOrders').textContent=valid.length;$('#sCups').textContent=valid.reduce((a,o)=>a+o.cups,0);$('#sTotal').textContent='฿'+valid.reduce((a,o)=>a+o.total,0).toLocaleString();
  ['new','accepted','ready'].forEach(k=>{const n=orders.filter(o=>o.status===k).length;$('#c-'+k).textContent=n?n:''});
  let a=tab==='all'?orders.slice().reverse():orders.filter(o=>o.status===tab).sort((x,y)=>x.time.localeCompare(y.time));
  $('#list').innerHTML=a.length?a.map(o=>{
    const items=(o.items||[]).map(x=>'<div class="it"><div><div class="a">'+(((SHOP&&SHOP.menus||[]).find(m=>m.name===x.menu)||{icon:'🍵'}).icon+' ')+esc(x.menu)+'</div><div class="b">'+esc([x.tone?'โทน'+x.tone:'',x.milk||'',x.topping?'+Biscoff':'','หวาน '+x.sweet].filter(Boolean).join(' · '))+'</div></div><div class="q">×'+x.qty+'</div></div>').join('')||'<div class="it"><div class="b">'+esc(o.itemsText)+'</div></div>';
    const act={new:'<button class="go" data-s="accepted" data-no="'+esc(o.no)+'">✓ รับออเดอร์</button><button class="x" data-s="cancel" data-no="'+esc(o.no)+'">ยกเลิก</button>',
      accepted:'<button class="ok" data-s="ready" data-no="'+esc(o.no)+'">ทำเสร็จแล้ว</button><button class="x" data-s="new" data-no="'+esc(o.no)+'">ย้อน</button>',
      ready:'<button class="ok" data-s="done" data-no="'+esc(o.no)+'">ลูกค้ารับแล้ว</button><button class="x" data-s="accepted" data-no="'+esc(o.no)+'">ย้อน</button>',
      done:'<button class="x" style="flex:1" data-s="ready" data-no="'+esc(o.no)+'">ย้อนสถานะ</button>',cancel:'<button class="x" style="flex:1" data-s="new" data-no="'+esc(o.no)+'">กู้คืนออเดอร์</button>'}[o.status]||'';
    return '<div class="ord '+o.status+(o.no===FOCUS?' focus':'')+'" id="o-'+esc(o.no)+'"><div class="oh"><div><div class="no">#'+esc(o.no)+'</div><div class="nm">'+esc(o.name)+'</div><span class="badge '+o.status+'">'+(LBL[o.status]||o.status)+'</span>'+(o.by?' <span style="font-size:12px;opacity:.6">· '+esc(o.by)+'</span>':'')+'</div><div class="tm">'+hm(o.time)+'<br>'+o.cups+' แก้ว</div></div>'+items+
      '<div class="tot"><span>TOTAL</span><span style="color:var(--yellow)">฿'+o.total+'</span></div><div class="acts">'+act+'</div></div>'}).join(''):'<div class="empty">ไม่มีออเดอร์</div>';
  if(FOCUS&&!focused){const el=document.getElementById('o-'+FOCUS);if(el){focused=true;setTimeout(()=>el.scrollIntoView({behavior:'smooth',block:'center'}),100)}}
  $$('#list [data-s]').forEach(b=>b.onclick=async()=>{
    if(b.dataset.s==='cancel'&&!confirm('ยกเลิกออเดอร์ #'+b.dataset.no+' ?'))return;
    busy=true;b.disabled=true;b.textContent='...';
    try{await api('setOrderStatus',{no:b.dataset.no,status:b.dataset.s});const o=orders.find(x=>x.no===b.dataset.no);if(o)o.status=b.dataset.s;render();toast('อัปเดตแล้ว ✓')}
    catch(e){toast(e.message);render()}finally{busy=false}
  });
}
if(user){api('adminLogin').then(start).catch(()=>{})}
/* ---- shop controls ---- */
async function loadShop(){try{SHOP=await api('getShop');renderShop()}catch(e){}}
function renderShop(){
  if(!SHOP)return;
  const p=$('#shopPill');p.textContent=SHOP.isOpen?'OPEN':'CLOSED';p.classList.toggle('off',!SHOP.isOpen);
  if(document.activeElement!==$('#tOpen'))$('#tOpen').value=SHOP.open; if(document.activeElement!==$('#tClose'))$('#tClose').value=SHOP.close;
  const t=$('#toggleClose');t.textContent=SHOP.closedToday?'เปิดรับออเดอร์อีกครั้ง':'ปิดรับออเดอร์วันนี้';t.classList.toggle('on',!SHOP.closedToday);
  const lim=(SHOP.menus||[]).filter(m=>m.limited&&m.active);
  if(!(document.activeElement&&document.activeElement.tagName==='INPUT'&&$('#stockList').contains(document.activeElement)))
  $('#stockList').innerHTML=lim.length?lim.map((m,i)=>'<div class="srow2"><div class="n">'+esc(m.icon+' '+m.name)+'<small>'+(m.on?'ขายแล้ว '+m.sold+'/'+m.limit+' · เหลือ '+m.left:'วันนี้ยังไม่เปิดขาย')+'</small></div><input type="number" inputmode="numeric" min="0" data-st="'+esc(m.name)+'" value="'+(m.on?m.limit:'')+'" placeholder="แก้ว"><button class="sbtn" data-son="'+esc(m.name)+'">เปิด</button><button class="sbtn ghost" data-soff="'+esc(m.name)+'">ปิด</button></div>').join(''):'<div class="muted">ไม่มีเมนูจำกัดจำนวน (ตั้งได้ใน จัดการเมนู)</div>';
  $$('[data-son]').forEach(b=>b.onclick=()=>{const n=b.dataset.son,q=+$('[data-st="'+CSS.escape(n)+'"]').value;if(!(q>0))return toast('ใส่จำนวนแก้วก่อนนะคะ');setShop({stock:{[n]:q}},'เปิดขาย '+n+' '+q+' แก้ว ✓')});
  $$('[data-soff]').forEach(b=>b.onclick=()=>setShop({stock:{[b.dataset.soff]:0}},'ปิดขาย '+b.dataset.soff+' แล้ว'));
}
async function setShop(patch,msg){busy=true;try{SHOP=await api('setShop',{shop:patch});renderShop();toast(msg||'บันทึกแล้ว ✓')}catch(e){toast(e.message)}finally{busy=false}}
$('#saveTime').onclick=()=>setShop({open:$('#tOpen').value,close:$('#tClose').value},'ตั้งเวลารับออเดอร์แล้ว ✓');
$('#toggleClose').onclick=()=>{const c=!SHOP.closedToday;if(c&&!confirm('ปิดรับออเดอร์วันนี้?'))return;setShop({closedToday:c},c?'ปิดรับออเดอร์แล้ว':'เปิดรับออเดอร์แล้ว')};
/* ---- menu editor ---- */
let ED=null;
$('#menuBtn').onclick=()=>{if(!SHOP)return;ED={oatPrice:SHOP.oatPrice,toppingPrice:SHOP.toppingPrice,toppingName:SHOP.toppingName,items:SHOP.menus.map(m=>({name:m.name,sub:m.sub,icon:m.icon,price:m.price,tone:!!m.tone,milk:!!m.milk,topping:!!m.topping,limited:!!m.limited,active:m.active!==false}))};
  $('#mOat').value=ED.oatPrice;$('#mTop').value=ED.toppingPrice;$('#mTopName').value=ED.toppingName;renderEd();$('#menuM').style.display='flex'};
const TG=[['active','เปิดขาย'],['tone','เลือกโทน'],['milk','เลือกนม'],['topping','ท็อปปิ้ง'],['limited','จำกัดจำนวน']];
function renderEd(){
  $('#menuEd').innerHTML=ED.items.map((m,i)=>'<div class="mcard'+(m.active?'':' off')+'"><div class="r"><input style="flex:0 0 56px;text-align:center" data-i="'+i+'" data-k="icon" value="'+esc(m.icon)+'"><input data-i="'+i+'" data-k="name" value="'+esc(m.name)+'" placeholder="ชื่อเมนู"><input style="flex:0 0 80px" type="number" data-i="'+i+'" data-k="price" value="'+m.price+'" placeholder="฿"></div>'+
    '<div class="r"><input data-i="'+i+'" data-k="sub" value="'+esc(m.sub||'')+'" placeholder="คำอธิบายสั้นๆ (ไทย)"></div>'+
    '<div class="tg">'+TG.map(([k,t])=>'<button class="'+(m[k]?'on':'')+'" data-i="'+i+'" data-t="'+k+'">'+(m[k]?'✓ ':'')+t+'</button>').join('')+'<button class="del" data-del="'+i+'">ลบ</button></div></div>').join('');
  $$('#menuEd input').forEach(el=>el.oninput=()=>{ED.items[el.dataset.i][el.dataset.k]=el.dataset.k==='price'?+el.value:el.value});
  $$('#menuEd [data-t]').forEach(b=>b.onclick=()=>{const m=ED.items[b.dataset.i];m[b.dataset.t]=!m[b.dataset.t];renderEd()});
  $$('#menuEd [data-del]').forEach(b=>b.onclick=()=>{const m=ED.items[b.dataset.del];if(confirm('ลบเมนู '+m.name+' ?')){ED.items.splice(+b.dataset.del,1);renderEd()}});
}
$('#mAdd').onclick=()=>{ED.items.push({name:'',sub:'',icon:'🍵',price:80,tone:false,milk:false,topping:false,limited:false,active:true});renderEd();const ins=$$('#menuEd [data-k=name]');ins[ins.length-1].focus()};
$('#mCancel').onclick=()=>$('#menuM').style.display='none';
$('#mSave').onclick=async()=>{ED.oatPrice=+$('#mOat').value||0;ED.toppingPrice=+$('#mTop').value||0;ED.toppingName=$('#mTopName').value.trim()||'Biscoff';
  if(ED.items.some(m=>!String(m.name).trim()))return toast('ใส่ชื่อเมนูให้ครบก่อนนะคะ');
  const names=ED.items.map(m=>m.name.trim());if(new Set(names).size!==names.length)return toast('มีชื่อเมนูซ้ำกัน');
  busy=true;$('#mSave').disabled=true;try{SHOP=await api('setMenus',{menus:ED});renderShop();$('#menuM').style.display='none';toast('บันทึกเมนูแล้ว ✓ ลูกค้าเห็นทันที')}catch(e){toast(e.message)}finally{busy=false;$('#mSave').disabled=false}};
$('#sumBtn').onclick=async()=>{busy=true;try{const r=await api('daySummary',{send:false});
  $('#sumBody').innerHTML='<div style="font-size:15px;opacity:.8;margin-bottom:8px">'+r.date+'</div>'+Object.keys(r.byMenu).map(k=>'<div class="srow"><span>'+esc(k)+' × '+r.byMenu[k].qty+'</span><b>฿'+r.byMenu[k].amount.toLocaleString()+'</b></div>').join('')+
   '<div class="srow" style="font-family:var(--px);font-size:11px;border:none;margin-top:6px"><span>'+r.orders+' ORDERS · '+r.cups+' CUPS</span><span style="color:var(--yellow)">฿'+r.total.toLocaleString()+'</span></div>'+
   (r.pending?'<div style="color:var(--red);margin-top:8px">⚠ ยังมีออเดอร์ค้าง '+r.pending+' รายการ (ยังไม่ได้กด "ลูกค้ารับแล้ว")</div>':'');
  $('#sumRecord').checked=!(SHOP&&SHOP.summarizedToday);
  if(SHOP&&SHOP.summarizedToday)$('#sumBody').innerHTML+='<div style="margin-top:8px;opacity:.8">วันนี้บันทึกรายรับไปแล้ว จะไม่บันทึกซ้ำ</div>';
  $('#sumM').style.display='flex'}catch(e){toast(e.message)}finally{busy=false}};
$('#sumCancel').onclick=()=>$('#sumM').style.display='none';
$('#sumGo').onclick=async()=>{busy=true;$('#sumGo').disabled=true;try{const r=await api('daySummary',{send:true,record:$('#sumRecord').checked});
  $('#sumM').style.display='none';toast('ปิดยอดแล้ว'+(r.sent?' · ส่ง Telegram ✓':'')+(r.recorded?' · บันทึกรายรับ ✓':'')+(r.tgError?' · Telegram: '+r.tgError:''));loadShop()}
  catch(e){toast(e.message)}finally{busy=false;$('#sumGo').disabled=false}};
</script>
</body>
</html>
